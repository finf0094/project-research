# Local production-like stack: docker compose -f infra/docker-compose.yml up --build
# Then run migrations once: docker compose -f infra/docker-compose.yml run --rm api node src/db/migrate.ts
x-api-env: &api-env
  DATABASE_URL: postgres://exam:exam@postgres:5432/exam
  MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY to 32 random bytes in base64}
  STORAGE_DIR: /data/recordings
  TRUST_PROXY: '1' # Caddy
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  # Oral exams: the public URL browsers use to reach LiveKit, and the key pair it was started with.
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'exam']
      interval: 5s

  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment: *api-env
    volumes: [recordings:/data/recordings]
    depends_on: { postgres: { condition: service_healthy } }

  worker:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    command: ['node', 'src/worker.ts']
    # Lets the worker finish the attempt it is analysing on shutdown instead of being killed after 10 s.
    stop_grace_period: 60s
    environment: *api-env
    volumes: [recordings:/data/recordings]
    depends_on: { postgres: { condition: service_healthy } }

  web:
    build: { context: .., dockerfile: infra/Dockerfile.web }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ['80:80', '443:443']
    depends_on: [api]

  # Video calls for oral exams; started only with `--profile oral`.
  livekit:
    image: livekit/livekit-server:v1.9
    profiles: [oral]
    # node-ip: the address browsers send media to (the server's public IP); signalling goes through Caddy.
    command: ['--dev', '--bind', '0.0.0.0', '--node-ip', '${LIVEKIT_NODE_IP:-127.0.0.1}']
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}'
    ports: ['7880:7880', '7881:7881', '7882:7882/udp']

volumes:
  pgdata:
  recordings:
